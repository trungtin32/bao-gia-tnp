<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>OHCN · Check giao dịch</title>
<style>
  body{font-family:"Segoe UI",Arial,sans-serif;background:#EEF1F4;color:#16212C;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;padding:16px;box-sizing:border-box}
  .c{background:#fff;padding:28px 30px;border-radius:14px;box-shadow:0 8px 24px -12px rgba(0,0,0,.25);text-align:center;max-width:420px;width:100%}
  .m{width:44px;height:44px;border-radius:11px;background:linear-gradient(155deg,#1f6feb,#123449);color:#fff;font-weight:700;display:inline-flex;align-items:center;justify-content:center;font-size:18px}
  a{color:#1f6feb;font-weight:600} .s{color:#56667A;font-size:14px;line-height:1.5}
</style>
</head>
<body>
<div class="c">
  <div class="m">₫</div>
  <h2 style="margin:12px 0 6px">OHCN · Check giao dịch</h2>
  <p class="s" id="s">Đang mở hệ thống…</p>
  <p id="a"></p>
</div>
<script>
// Đọc link mới nhất từ 2 nguồn: kênh ntfy và ohcn/link.json trên GitHub; chỉ nhận link có chữ ký số hợp lệ của máy chủ.
(async function () {
  var TOPIC = "ohcn-2664896fe798b9690f";
  var KEY = {"kty":"EC","crv":"P-256","x":"7dHamsSZGfPK6LdpNmmjaGnGbDFPE1_E3k2snfRk2MY","y":"sGoeyMgDXw5T2vIPFSrdLzQAbeyKVXCDxt1a63D6iek"};
  var GH_RAW = "https://raw.githubusercontent.com/trungtin32/bao-gia-tnp/HEAD/ohcn/link.json";
  var s = document.getElementById('s');
  function b64(x){x=x.replace(/-/g,'+').replace(/_/g,'/');while(x.length%4)x+='=';var r=atob(x),u=new Uint8Array(r.length);for(var i=0;i<r.length;i++)u[i]=r.charCodeAt(i);return u;}
  function wait(p,ms){return Promise.race([p,new Promise(function(_,no){setTimeout(function(){no(new Error('het gio'));},ms);})]);}
  async function fromNtfy(){var res=await fetch('https://ntfy.sh/'+TOPIC+'/json?poll=1&since=12h',{cache:'no-store'});var out=[],lines=(await res.text()).trim().split('\n');for(var i=0;i<lines.length;i++){try{var m=JSON.parse(lines[i]);if(m.event==='message')out.push(JSON.parse(m.message));}catch(e){}}return out;}
  async function fromGithub(){var r=await fetch(GH_RAW+'?t='+Date.now(),{cache:'no-store'});return r.ok?[JSON.parse(await r.text())]:[];}
  try {
    var key = await crypto.subtle.importKey('jwk', KEY, { name: 'ECDSA', namedCurve: 'P-256' }, false, ['verify']);
    var got = await Promise.allSettled([wait(fromNtfy(), 8000), wait(fromGithub(), 8000)]);
    var best = null;
    for (var g = 0; g < got.length; g++) {
      if (got[g].status !== 'fulfilled') continue;
      for (var i = 0; i < got[g].value.length; i++) {
        var d = got[g].value[i];
        try {
          if (!d || !/^https:\/\/[a-z0-9-]+\.trycloudflare\.com$/.test(d.u)) continue;
          var ok = await crypto.subtle.verify({ name: 'ECDSA', hash: 'SHA-256' }, key, b64(d.s), new TextEncoder().encode(d.u));
          if (ok && (!best || d.t > best.t)) best = d;
        } catch (e) {}
      }
    }
    if (best) {
      document.getElementById('a').innerHTML = '<a href="' + best.u + '">Bấm vào đây nếu không tự chuyển</a>';
      location.replace(best.u + location.hash);
    } else {
      s.textContent = 'Hệ thống đang tắt (máy chủ chưa bật hoặc mất mạng). Thử lại sau ít phút.';
    }
  } catch (e) {
    s.textContent = 'Không kết nối được. Tải lại trang (F5).';
  }
})();
</script>
</body>
</html>
